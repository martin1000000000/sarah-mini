services:
  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sarah_mini
      DB_USER: sarah_user
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sarah_mini
      POSTGRES_USER: sarah_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarah_user -d sarah_mini"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
